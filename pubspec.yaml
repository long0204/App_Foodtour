flutter_gen:
  output: lib/config/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  generate: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/auth/
    - assets/images/home/
#    - assets/images/home/onboarding/
#    - assets/images/loyalty/
    - assets/images/pay/
    - assets/images/shared/
    - assets/images/job/
    - assets/images/user/
    - assets/images/rank/
    - assets/lottie/
    - assets/rive/
    - assets/icons/
    - assets/icons/favicon/
#    - assets/icons/chatbot/

  fonts:
    - family: K2D
      fonts:
        - asset: assets/fonts/K2D-Regular.ttf
          weight: 400
        - asset: assets/fonts/K2D-Medium.ttf
          weight: 500
        - asset: assets/fonts/K2d-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/K2d-Bold.ttf
          weight: 700


  uses-material-design: true
